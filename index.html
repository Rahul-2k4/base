<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- Bootstrap row divides the page into 12 columns -->
    <div class="container-fluid">
        <div class="row">

            <!-- Sidebar uses 2 columns on medium and large screens -->
            <div class="col-md-2 bg-dark text-white sidebar">
                <h3>Dashboard</h3>
                <a href="#">Home</a>
                <a href="#">Students</a>
                <a href="#">Courses</a>
                <a href="#">Exams</a>
            </div>

            <!-- Main area uses the remaining 10 columns -->
            <div class="col-md-10 p-3">
                <h2>College Admin Dashboard</h2>

                <!-- Four boxes: 3 columns each (3 + 3 + 3 + 3 = 12) -->
                <div class="row text-center">
                    <div class="col-md-3 bg-primary text-white p-3">
                        <h4>Students</h4>
                        <p>1500</p>
                    </div>
                    <div class="col-md-3 bg-success text-white p-3">
                        <h4>Courses</h4>
                        <p>35</p>
                    </div>
                    <div class="col-md-3 bg-warning p-3">
                        <h4>Exams</h4>
                        <p>20</p>
                    </div>
                    <div class="col-md-3 bg-danger text-white p-3">
                        <h4>Results</h4>
                        <p>8</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
