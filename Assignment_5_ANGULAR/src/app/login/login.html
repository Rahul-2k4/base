<div class="container">

<h2>User Login</h2>

<form (ngSubmit)="login()">

    <input type="email"
    placeholder="Enter Email"
    [(ngModel)]="email"
    name="email"
    required>

    <input type="password"
    placeholder="Enter Password"
    [(ngModel)]="password"
    name="password"
    required>

    <button type="submit">Login</button>

</form>

</div>
