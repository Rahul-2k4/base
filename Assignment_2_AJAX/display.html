<!DOCTYPE html>
<html>
<head>
    <title>Registered Users</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2>Registered Users</h2>

    <table>

        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Mobile</th>
        </tr>

        <tbody id="data"></tbody>

    </table>

    <script>

        let users = JSON.parse(localStorage.getItem("users")) || [];

        let data = document.getElementById("data");

        users.forEach(function(user) {

            data.innerHTML += `
                <tr>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td>${user.mobile}</td>
                </tr>
            `;

        });

    </script>

</body>
</html>
